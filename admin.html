<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>뉴니콘 관리자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F7;color:#222;font-size:14px;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;}
/* Layout */
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;background:#1A1A2E;color:#CCC;flex-shrink:0;display:flex;flex-direction:column;}
#sidebar .logo{padding:20px 16px;color:#fff;font-weight:700;font-size:16px;border-bottom:1px solid #333;}
#sidebar .logo span{color:#B09FE8;}
#sidebar nav{flex:1;padding:12px 0;}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;color:#AAA;border-radius:0;transition:background .15s;}
#sidebar nav a:hover,#sidebar nav a.active{background:#2A2A44;color:#fff;}
#sidebar nav a .ico{width:16px;text-align:center;}
#sidebar .sbfooter{padding:14px 18px;font-size:12px;color:#666;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:52px;background:#fff;border-bottom:1px solid #E8E8EC;display:flex;align-items:center;padding:0 24px;gap:16px;}
#topbar .tb-title{font-weight:600;font-size:15px;flex:1;}
#topbar .tb-user{font-size:13px;color:#888;}
#topbar .tb-logout{font-size:12px;color:#B09FE8;cursor:pointer;padding:5px 10px;border-radius:6px;}
#topbar .tb-logout:hover{background:#F0ECFF;}
#content{flex:1;overflow-y:auto;padding:24px;}

/* Cards & panels */
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px;}
.card-title{font-weight:600;font-size:14px;color:#555;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px;}
.stat-box{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stat-box .sv{font-size:28px;font-weight:700;color:#5B4FCF;}
.stat-box .sl{font-size:12px;color:#888;margin-top:4px;}
.stat-box.danger .sv{color:#D94F40;}
.stat-box.warn .sv{color:#D98F00;}

/* Table */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{background:#F5F4F7;padding:9px 12px;text-align:left;font-size:12px;font-weight:600;color:#666;white-space:nowrap;}
tbody td{padding:9px 12px;border-bottom:1px solid #F0EFF3;font-size:13px;vertical-align:middle;}
tbody tr:hover{background:#FAFAFE;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.tag-high{background:#FDEEEC;color:#C0392B;}
.tag-caution{background:#FEF3E2;color:#B7770D;}
.tag-normal{background:#EDF8F1;color:#27AE60;}
.tag-pending{background:#EEF2FF;color:#4F5DBF;}
.tag-completed{background:#F0F0F0;color:#888;}
.tag-active{background:#EDF8F1;color:#27AE60;}
.tag-inactive{background:#F9F0F0;color:#C0392B;}

/* Forms */
.form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:12px;color:#666;font-weight:500;}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{
  padding:7px 10px;border:1px solid #DDD;border-radius:7px;background:#fff;color:#222;
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:#7C6FCF;}
textarea{resize:vertical;min-height:80px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;transition:background .15s;}
.btn-p{background:#5B4FCF;color:#fff;} .btn-p:hover{background:#4A3EBE;}
.btn-s{background:#F0ECFF;color:#5B4FCF;} .btn-s:hover{background:#E4DFFF;}
.btn-d{background:#FDEEEC;color:#C0392B;} .btn-d:hover{background:#FBDCD9;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:14px;padding:24px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;color:#222;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.close-btn{position:absolute;top:14px;right:16px;font-size:20px;color:#888;cursor:pointer;}

/* Login */
#screen-login{position:fixed;inset:0;background:#F5F4F7;display:flex;align-items:center;justify-content:center;z-index:200;}
.login-box{background:#fff;border-radius:16px;padding:40px;width:360px;box-shadow:0 4px 20px rgba(0,0,0,.1);}
.login-box h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.login-box p{color:#888;font-size:13px;margin-bottom:24px;}
.login-box input{width:100%;padding:10px 12px;border:1px solid #DDD;border-radius:8px;margin-bottom:10px;font-size:14px;}
.login-box button{width:100%;padding:11px;background:#5B4FCF;color:#fff;border-radius:8px;font-size:15px;font-weight:600;margin-top:4px;}
.login-err{color:#C0392B;font-size:13px;text-align:center;margin-top:8px;}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;display:none;white-space:nowrap;}

/* Pagination */
.pager{display:flex;align-items:center;gap:6px;margin-top:12px;}
.pager button{padding:5px 10px;border-radius:6px;background:#F0ECFF;color:#5B4FCF;font-size:12px;}
.pager button:disabled{opacity:.4;cursor:default;}
.pager span{font-size:12px;color:#888;}

/* Detail panel */
.detail-pre{background:#F5F4F7;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;}

/* Risk queue badge */
.risk-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:12px;font-weight:600;}

/* Section tabs */
.tabs{display:flex;gap:2px;margin-bottom:16px;}
.tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:#5B4FCF;border-bottom-color:#5B4FCF;background:#F0ECFF;}

/* misc */
.sep{height:1px;background:#F0EFF3;margin:12px 0;}
.empty{text-align:center;color:#AAA;padding:32px;font-size:13px;}
.inl{display:inline;}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="screen-login">
  <div class="login-box">
    <h1>🛡️ 관리자 로그인</h1>
    <p>뉴니콘 운영자 전용 페이지입니다.</p>
    <input type="email" id="li-email" placeholder="이메일" autocomplete="email">
    <input type="password" id="li-pw" placeholder="비밀번호" autocomplete="current-password">
    <button id="li-btn" onclick="doLogin()">로그인</button>
    <div id="li-err" class="login-err"></div>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="logo">🦄 <span>뉴니콘</span> 관리</div>
    <nav>
      <a href="#" class="nav-link active" data-page="dashboard"><span class="ico">📊</span> 대시보드</a>
      <a href="#" class="nav-link" data-page="consultations"><span class="ico">💬</span> AI 상담 관리</a>
      <a href="#" class="nav-link" data-page="risk"><span class="ico">⚠️</span> 위험 검토함 <span id="risk-badge" style="background:#C0392B;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:auto;display:none">0</span></a>
      <a href="#" class="nav-link" data-page="reviewed"><span class="ico">✅</span> 검수 답변</a>
      <a href="#" class="nav-link" data-page="products"><span class="ico">🧪</span> 제품 DB</a>
      <a href="#" class="nav-link" data-page="nutrition"><span class="ico">📋</span> 영양 기준값</a>
      <a href="#" class="nav-link" data-page="users"><span class="ico">👤</span> 회원 관리</a>
      <a href="#" class="nav-link" data-page="settings"><span class="ico">⚙️</span> 운영 설정</a>
    </nav>
    <div class="sbfooter" id="sb-role">역할: 확인 중...</div>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="tb-title" id="tb-title">대시보드</div>
      <div class="tb-user" id="tb-user"></div>
      <div class="tb-logout" onclick="doLogout()">로그아웃</div>
    </div>
    <div id="content"><!-- 동적 렌더링 --></div>
  </div>
</div>

<div id="toast"></div>

<!-- Overlay for modals -->
<div id="overlay" class="overlay" style="display:none" onclick="closeOverlay(event)"></div>
<div id="modal-wrap" style="position:fixed;inset:0;z-index:101;pointer-events:none;display:flex;align-items:center;justify-content:center;"></div>

<script>
// ── Supabase 클라이언트 (anon key — 인증만 사용) ─────────────────
const SUPA_URL = 'https://oxrdienywxsooygxvqgf.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94cmRpZW55d3hzb295Z3h2cWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODgzNDMsImV4cCI6MjA5NTk2NDM0M30.rSpYrPX1H1BQetQdojMwO3SVBvFs9gfHhOPaUOo-eo8';

let supabase;
let adminToken = null;
let adminEmail = '';
let adminRole  = '';

async function initSupabase() {
  // CDN에서 Supabase 로드
  if (!window.supabase) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  supabase = window.supabase.createClient(SUPA_URL, SUPA_ANON);

  // 세션 복원 시도
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    adminToken = session.access_token;
    adminEmail = session.user.email || '';
    await verifyAndShow(session);
  }
}

async function verifyAndShow(session) {
  // 관리자 권한 확인 (대시보드 API 호출로 검증)
  const res = await apiGet('/api/admin/dashboard');
  if (res.error) {
    adminToken = null;
    showToast('관리자 권한이 없는 계정입니다.', 3000);
    return;
  }
  adminToken = session.access_token;
  adminEmail = session.user.email || '';

  // 역할 가져오기 (users API)
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('tb-user').textContent = adminEmail;

  // 대시보드로 시작
  navigate('dashboard');
  updateRiskBadge();
}

async function doLogin() {
  const email = document.getElementById('li-email').value.trim();
  const pw    = document.getElementById('li-pw').value;
  const btn   = document.getElementById('li-btn');
  const errEl = document.getElementById('li-err');
  errEl.textContent = '';
  if (!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력하세요.'; return; }

  btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
    if (error) { errEl.textContent = '이메일 또는 비밀번호가 틀렸습니다.'; return; }
    adminToken = data.session.access_token;
    await verifyAndShow(data.session);
    if (!adminToken) { errEl.textContent = '관리자 권한이 없는 계정입니다.'; }
  } finally {
    btn.disabled = false; btn.textContent = '로그인';
  }
}

async function doLogout() {
  await supabase.auth.signOut();
  adminToken = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
}

// ── API 헬퍼 ─────────────────────────────────────────────────────
async function apiGet(path, params = {}) {
  const url = new URL(path, location.origin);
  Object.entries(params).forEach(([k,v]) => v !== '' && v != null && url.searchParams.set(k, v));
  const res = await fetch(url.toString(), {
    headers: { Authorization: `Bearer ${adminToken}` }
  });
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}` },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function apiPut(path, body) {
  const res = await fetch(path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}` },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function apiPatch(path, body) {
  const res = await fetch(path, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}` },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function apiDelete(path, body) {
  const res = await fetch(path, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}` },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ── 라우팅 ───────────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard:'대시보드', consultations:'AI 상담 관리', risk:'위험 검토함',
  reviewed:'검수 답변 관리', products:'제품 DB 관리', nutrition:'영양 기준값 관리',
  users:'회원 관리', settings:'운영 설정',
};

function navigate(page) {
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  document.getElementById('tb-title').textContent = PAGE_TITLES[page] || page;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty">로딩 중...</div>';

  switch(page) {
    case 'dashboard':     renderDashboard(); break;
    case 'consultations': renderConsultations(); break;
    case 'risk':          renderRisk(); break;
    case 'reviewed':      renderReviewed(); break;
    case 'products':      renderProducts(); break;
    case 'nutrition':     renderNutrition(); break;
    case 'users':         renderUsers(); break;
    case 'settings':      renderSettings(); break;
  }
}

document.querySelectorAll('.nav-link').forEach(a => {
  a.addEventListener('click', e => { e.preventDefault(); navigate(a.dataset.page); });
});

// ── 위험 배지 업데이트 ───────────────────────────────────────────
async function updateRiskBadge() {
  const data = await apiGet('/api/admin/dashboard');
  const count = data.risk?.totalPendingReview || 0;
  const badge = document.getElementById('risk-badge');
  badge.style.display = count > 0 ? 'inline' : 'none';
  badge.textContent = count;
}

// ── DASHBOARD ────────────────────────────────────────────────────
async function renderDashboard() {
  const data = await apiGet('/api/admin/dashboard');
  if (data.error) { setContent('<div class="empty">데이터 로드 오류</div>'); return; }

  const c = data.consultations;
  const r = data.risk;
  const u = data.users;

  setContent(`
    <div class="stat-grid">
      <div class="stat-box"><div class="sv">${c.today}</div><div class="sl">오늘 상담</div></div>
      <div class="stat-box"><div class="sv">${c.last7d}</div><div class="sl">7일 상담</div></div>
      <div class="stat-box"><div class="sv">${c.last30d}</div><div class="sl">30일 상담</div></div>
      <div class="stat-box"><div class="sv">${c.successRate != null ? c.successRate+'%' : 'N/A'}</div><div class="sl">오늘 성공률</div></div>
      <div class="stat-box danger"><div class="sv">${r.highPending}</div><div class="sl">위험 검토 대기</div></div>
      <div class="stat-box warn"><div class="sv">${r.cautionPending}</div><div class="sl">주의 검토 대기</div></div>
      <div class="stat-box"><div class="sv">${u.newLast7d}</div><div class="sl">신규 회원(7일)</div></div>
      <div class="stat-box"><div class="sv">${u.scansLast7d}</div><div class="sl">스캔 이력(7일)</div></div>
    </div>

    ${r.totalPendingReview > 0 ? `
    <div class="card" style="border-left:4px solid #C0392B;">
      <div class="card-title">⚠️ 위험 검토 대기 — ${r.totalPendingReview}건</div>
      ${riskQueueTable(data.riskQueue)}
    </div>` : ''}

    <div class="card">
      <div class="card-title">최근 상담 10건</div>
      ${recentChatsTable(data.recentChats)}
    </div>

    ${data.recentFailed.length > 0 ? `
    <div class="card">
      <div class="card-title">최근 실패 상담</div>
      ${failedTable(data.recentFailed)}
    </div>` : ''}

    <div style="font-size:12px;color:#AAA;text-align:right;margin-top:8px;">
      ${data.generatedAt ? '생성 시각: ' + new Date(data.generatedAt).toLocaleString('ko-KR') : ''}
    </div>
  `);
}

function recentChatsTable(rows) {
  if (!rows?.length) return '<div class="empty">상담 기록 없음</div>';
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>질문</th><th>상태</th><th>위험도</th><th>검토</th><th>연령</th><th>시각</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.question)}</td>
      <td>${statusTag(r.status)}</td>
      <td>${riskTag(r.risk_level)}</td>
      <td>${reviewTag(r.review_status)}</td>
      <td>${esc(r.child_age_label||'-')}</td>
      <td style="white-space:nowrap">${fmtDate(r.created_at)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function riskQueueTable(rows) {
  if (!rows?.length) return '<div class="empty">없음</div>';
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>질문</th><th>위험도</th><th>플래그</th><th>연령</th><th>시각</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td style="max-width:220px">${esc(r.question)}</td>
      <td>${riskTag(r.risk_level)}</td>
      <td style="font-size:11px;color:#888">${(r.risk_flags||[]).join(', ')}</td>
      <td>${esc(r.child_age_label||'-')}</td>
      <td style="white-space:nowrap">${fmtDate(r.created_at)}</td>
      <td><button class="btn btn-s btn-sm" onclick="navigate('risk')">검토</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function failedTable(rows) {
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>질문</th><th>상태</th><th>오류코드</th><th>시각</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.question)}</td>
      <td>${statusTag(r.status)}</td>
      <td><code>${esc(r.error_code||'-')}</code></td>
      <td>${fmtDate(r.created_at)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

// ── CONSULTATIONS ────────────────────────────────────────────────
let chatPage = 1;
const chatFilters = {};

async function renderConsultations() {
  setContent(`
    <div class="card">
      <div class="form-row">
        <div class="form-group"><label>상태</label>
          <select id="cf-status"><option value="">전체</option>
            <option>success</option><option>failed</option><option>timeout</option><option>empty_reply</option>
          </select>
        </div>
        <div class="form-group"><label>위험도</label>
          <select id="cf-risk"><option value="">전체</option>
            <option value="high">high</option><option value="caution">caution</option><option value="normal">normal</option>
          </select>
        </div>
        <div class="form-group"><label>검토상태</label>
          <select id="cf-review"><option value="">전체</option>
            <option value="pending">pending</option><option value="reviewing">reviewing</option>
            <option value="completed">completed</option><option value="dangerous">dangerous</option>
          </select>
        </div>
        <div class="form-group"><label>키워드</label>
          <input type="text" id="cf-keyword" placeholder="질문 내 키워드" style="width:160px">
        </div>

async function submitRiskResolve(chatId) {
  const resolution = document.getElementById('rr-resolution')?.value;

  const note       = document.getElementById('rr-note')?.value;
  if (!resolution) { showToast('검토 결과를 선택하세요.'); return; }

  const res = await fetch('/api/admin/risk/resolve', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}` },
    body: JSON.stringify({ chat_id: chatId, resolution, reviewer_note: note, final_risk_level: finalRisk||undefined }),
  });
  const data = await res.json();
  if (data.error) { showToast('오류: ' + data.error); return; }
  showToast('검토 완료 처리되었습니다');
  closeModal();
  loadRisk(riskPage);
  updateRiskBadge();

async function submitProductCreate() {
  const brand = document.getElementById('nc-brand')?.value.trim();
  const name  = document.getElementById('nc-name')?.value.trim();
  if (!brand || !name) { showToast('브랜드와 제품명은 필수입니다'); return; }

  const nutrients = [];
  for (let i = 0; i < ncRowCount; i++) {
    const nName = document.getElementById(`nn-name-${i}`)?.value.trim();
    const amt   = parseFloat(document.getElementById(`nn-amt-${i}`)?.value || '0');
    const unit  = document.getElementById(`nn-unit-${i}`)?.value.trim();
    if (nName) nutrients.push({ nutrient_name: nName, amount_per_serving: amt, unit });
  }

  const res = await apiPost('/api/admin/products', {
    product: {
      brand, product_name: name,
      product_type: document.getElementById('nc-type')?.value,
      is_children: document.getElementById('nc-children')?.value === 'true',
    },
    nutrients,
    idempotency_key: `create-${Date.now()}`,

async function renderSettings() {
  const data = await apiGet('/api/admin/settings');
  if (data.error) { setContent('<div class="empty">오류: ' + data.error + '</div>'); return; }

  const s = data.settings || {};
  const rows = data.allowed_keys?.map(k => {
    const val = s[k]?.value;
    const valStr = typeof val === 'object' ? JSON.stringify(val) : String(val ?? '');
    return `<tr>
      <td><b>${esc(k)}</b><br><span style="font-size:11px;color:#888">${esc(s[k]?.description||'')}</span></td>
      <td><input type="text" id="st-${k}" value="${esc(valStr)}" style="width:100%;min-width:160px"></td>
      <td><button class="btn btn-s btn-sm" onclick="saveOneSetting('${k}')">저장</button></td>
    </tr>`;
  }).join('') || '';

  setContent(`
    <div class="card">
      <div class="card-title">운영 설정 관리 <span style="font-size:11px;font-weight:400;color:#AAA">— 변경 즉시 반영됩니다. 신중히 수정하세요.</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>설정 키</th><th>값</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
  `);
}

async function saveOneSetting(key) {
  const rawVal = document.getElementById(`st-${key}`)?.value;
  let value = rawVal;
  // JSON 배열 자동 파싱
  if (rawVal.trim().startsWith('[')) {
    try { value = JSON.parse(rawVal); } catch { showToast('JSON 형식 오류'); return; }
  }
  // 불리언
  if (rawVal === 'true') value = true;
  if (rawVal === 'false') value = false;

  const res = await apiPatch('/api/admin/settings', { key, value, change_note: '관리자 수정' });
  if (res.error) { showToast('오류: ' + res.error); return; }
  showToast(`'${key}' 저장 완료`);
}

// ── 공통 유틸 ─────────────────────────────────────────────────────
function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
}

function statusTag(s) {
  const map = {success:'tag-normal', failed:'tag-high', timeout:'tag-caution', empty_reply:'tag-caution'};
  return `<span class="tag ${map[s]||'tag-completed'}">${esc(s||'—')}</span>`;
}

function riskTag(r) {
  const map = {high:'tag-high', caution:'tag-caution', normal:'tag-normal'};
  return `<span class="tag ${map[r]||'tag-completed'}">${esc(r||'—')}</span>`;
}

function reviewTag(r) {
  const map = {pending:'tag-pending', reviewing:'tag-caution', completed:'tag-completed', dangerous:'tag-high', normal:'tag-normal'};
  return `<span class="tag ${map[r]||'tag-completed'}">${esc(r||'—')}</span>`;
}

function renderPager(wrapperId, page, total, limit, callback) {
  const totalPages = Math.ceil(total / limit);
  const wrap = document.getElementById(wrapperId);
  if (!wrap || totalPages <= 1) { if (wrap) wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <button onclick="${callback.name}(${page-1})" ${page<=1?'disabled':''}>◀</button>
    <span>${page} / ${totalPages} (총 ${total}건)</span>
    <button onclick="${callback.name}(${page+1})" ${page>=totalPages?'disabled':''}>▶</button>
  `;
}

let currentModal = null;

function showModal(html) {
  document.getElementById('overlay').style.display = 'flex';
  const wrap = document.getElementById('modal-wrap');
  wrap.style.pointerEvents = 'all';
  wrap.innerHTML = `<div class="modal" style="position:relative">${html}</div>`;
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
  const wrap = document.getElementById('modal-wrap');
  wrap.style.pointerEvents = 'none';
  wrap.innerHTML = '';
}

function closeOverlay(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

let toastTimer;
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, duration);
}
